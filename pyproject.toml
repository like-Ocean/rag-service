[project]
name = "moodle-rag-service"
version = "0.1.0"
description = "RAG-микросервис для умного поиска Moodle (FastAPI + Chroma + Ollama)"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "fastapi>=0.119",
    "uvicorn>=0.38",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pix2text>=1.1",
    "rapidocr>=3.9.1,<3.10",  # cnstd 1.2.x несовместим с rapidocr 3.10+ (нет resolve_model_key)
    "ollama>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "routers", "schemas", "service", "helpers", "scripts"]
